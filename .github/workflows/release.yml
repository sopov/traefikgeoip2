name: Release checks

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Tag is semver and the manifest matches the module
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $tag is not vMAJOR.MINOR.PATCH"; exit 1; }
          module="$(awk '/^module /{print $2}' go.mod)"
          grep -q "^import: ${module}\$" .traefik.yml || { echo ".traefik.yml import does not match go.mod module ${module}"; exit 1; }
          test -f LICENSE && test -f NOTICE
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: make yaegi
